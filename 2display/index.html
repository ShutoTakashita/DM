<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DM Simulator - 2 Display</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    .container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    .slot {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .slot iframe {
      position: absolute;
      border: none;
    }
    .divider {
      height: 2px;
      background: #444;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="slot">
      <iframe src="../index.html" scrolling="no" allow="clipboard-read; clipboard-write" allowfullscreen></iframe>
    </div>
    <div class="divider"></div>
    <div class="slot">
      <iframe src="../index.html" scrolling="no" allow="clipboard-read; clipboard-write" allowfullscreen></iframe>
    </div>
  </div>
  <script>
    // ゲームのアスペクト比 (canvas width / height)
    var RATIO = 2 / 1;

    function resize() {
      document.querySelectorAll('.slot').forEach(function(slot) {
        var iframe = slot.querySelector('iframe');
        var sw = slot.clientWidth;
        var sh = slot.clientHeight;
        var w, h;

        if (sw / sh > RATIO) {
          // スロットが横長 → 高さに合わせる
          h = sh;
          w = Math.floor(sh * RATIO);
        } else {
          // スロットが縦長 → 幅に合わせる
          h = Math.floor(sw / RATIO);
          w = sw;
        }

        iframe.style.width = w + 'px';
        iframe.style.height = h + 'px';
        iframe.style.left = Math.floor((sw - w) / 2) + 'px';
        iframe.style.top = Math.floor((sh - h) / 2) + 'px';
      });
    }

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function() { setTimeout(resize, 300); });
    window.addEventListener('load', resize);
    resize();
  </script>
</body>
</html>
