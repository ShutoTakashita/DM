<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DM Simulator - 2 Display</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    .container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    .slot {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .slot iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: none;
    }
    .divider {
      height: 2px;
      background: #444;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="slot">
      <iframe src="../index.html" scrolling="no" allow="clipboard-read; clipboard-write" allowfullscreen></iframe>
    </div>
    <div class="divider"></div>
    <div class="slot">
      <iframe src="../index.html" scrolling="no" allow="clipboard-read; clipboard-write" allowfullscreen></iframe>
    </div>
  </div>
  <script>
    var GAME_W = 960;
    var GAME_H = 600;
    var GAME_RATIO = GAME_W / GAME_H;

    function resizeIframes() {
      document.querySelectorAll('.slot').forEach(function(slot) {
        var iframe = slot.querySelector('iframe');
        var sw = slot.clientWidth;
        var sh = slot.clientHeight;
        var slotRatio = sw / sh;
        var w, h;

        if (slotRatio > GAME_RATIO) {
          h = sh;
          w = Math.floor(sh * GAME_RATIO);
        } else {
          w = sw;
          h = Math.floor(sw / GAME_RATIO);
        }

        // iframeをゲーム解像度で描画し、CSSでスロットに収まるようスケール
        iframe.width = GAME_W;
        iframe.height = GAME_H;
        var scale = w / GAME_W;
        iframe.style.width = GAME_W + 'px';
        iframe.style.height = GAME_H + 'px';
        iframe.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
      });
    }

    window.addEventListener('resize', resizeIframes);
    window.addEventListener('orientationchange', function() {
      setTimeout(resizeIframes, 200);
    });
    window.addEventListener('load', resizeIframes);
    setTimeout(resizeIframes, 100);
  </script>
</body>
</html>
