<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DM Simulator - 2 Display</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    .container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    .slot {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .slot iframe {
      border: none;
      aspect-ratio: 960 / 600;
      max-width: 100%;
      max-height: 100%;
    }
    .divider {
      height: 2px;
      background: #444;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="slot">
      <iframe src="../index.html" allow="clipboard-read; clipboard-write" allowfullscreen></iframe>
    </div>
    <div class="divider"></div>
    <div class="slot">
      <iframe src="../index.html" allow="clipboard-read; clipboard-write" allowfullscreen></iframe>
    </div>
  </div>
  <script>
    function resizeIframes() {
      document.querySelectorAll('.slot').forEach(function(slot) {
        var iframe = slot.querySelector('iframe');
        var sw = slot.clientWidth;
        var sh = slot.clientHeight;
        var gameRatio = 960 / 600;
        var slotRatio = sw / sh;

        if (slotRatio > gameRatio) {
          // slot is wider than game -> fit by height
          iframe.style.height = sh + 'px';
          iframe.style.width = (sh * gameRatio) + 'px';
        } else {
          // slot is taller than game -> fit by width
          iframe.style.width = sw + 'px';
          iframe.style.height = (sw / gameRatio) + 'px';
        }
      });
    }
    window.addEventListener('resize', resizeIframes);
    window.addEventListener('load', resizeIframes);
    resizeIframes();
  </script>
</body>
</html>
